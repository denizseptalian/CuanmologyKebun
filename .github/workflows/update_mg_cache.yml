name: Update Minyak Goreng Cache

on:
  schedule:
    # Setiap hari jam 00:00 WIB (17:00 UTC)
    - cron: '0 17 * * *'
  workflow_dispatch:  # Bisa juga trigger manual dari tab Actions

jobs:
  update-cache:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests curl_cffi pandas pyarrow

      - name: Update minyak goreng cache
        run: python update_mg_cache.py --days 180

      - name: Commit & push jika ada data baru
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/minyakgoreng_cache.parquet
          git diff --staged --quiet && echo "Tidak ada perubahan." || (
            git commit -m "auto: update minyak goreng cache $(date +'%Y-%m-%d')" &&
            git push
          )
